# ╔══════════════════════════════════════════════════════╗
# ║              kitty.conf — Tokyo Night theme          ║
# ╚══════════════════════════════════════════════════════╝

# ── Шрифт ────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0

# ── Прозрачность ─────────────────────────────────────────
background_opacity         0.78
dynamic_background_opacity yes

# ── Фон и текст ──────────────────────────────────────────
# background  #1f2335
# foreground  #c0caf5

# ── Курсор ───────────────────────────────────────────────
# cursor                #7aa2f7
# cursor_text_color     #1f2335
cursor_shape          block
cursor_blink_interval 0.5

# ── Выделение ────────────────────────────────────────────
# selection_background #3b4261
# selection_foreground #c0caf5

# ── URL ──────────────────────────────────────────────────
# url_color   #7aa2f7
url_style   curly

# ── Цвета терминала (16 ANSI) ────────────────────────────

# Black
# color0  #414868
# color8  #565f89

# Red
# color1  #f7768e
# color9  #f7768e

# Green
# color2  #9ece6a
# color10 #9ece6a

# Yellow
# color3  #e0af68
# color11 #e0af68

# Blue
# color4  #7aa2f7
# color12 #7aa2f7

# Magenta
# color5  #bb9af7
# color13 #bb9af7

# Cyan
# color6  #2ac3de
# color14 #2ac3de

# White
# color7  #c0caf5
# color15 #ffffff

# ── Окно ─────────────────────────────────────────────────
window_padding_width        10
window_border_width         2px
# active_border_color         #7aa2f7
# inactive_border_color       #414868
draw_minimal_borders        no

# ── Панель вкладок ───────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_title_template        " {index}: {title} "
# active_tab_foreground     #1f2335
# active_tab_background     #7aa2f7
# inactive_tab_foreground   #565f89
# inactive_tab_background   #292e42
# tab_bar_background        #1f2335
tab_bar_margin_height     0.0 0.0

# ── Поведение ────────────────────────────────────────────
scrollback_lines          10000
enable_audio_bell         no
visual_bell_duration      0.0
confirm_os_window_close   0
copy_on_select            yes

# ── Хоткеи ───────────────────────────────────────────────
# Прозрачность на лету
map ctrl+shift+a>m    set_background_opacity +0.05
map ctrl+shift+a>l    set_background_opacity -0.05
map ctrl+shift+a>1    set_background_opacity 1.0
map ctrl+shift+a>d    set_background_opacity default

# Вкладки
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+w      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab

# Сплиты
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window

# Шрифт
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0


# BEGIN_KITTY_THEME
# Tokyo Night Storm
include current-theme.conf
# END_KITTY_THEME